<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--accent:#2B4C86}
*{box-sizing:border-box}
body{margin:0;background:#F6F5F1;color:#16181D;font-family:'Inter','Noto Sans KR',system-ui,sans-serif}
a{color:var(--accent)}a:hover{color:#1B3560}
.wrap{max-width:1080px;margin:0 auto;padding:24px 24px 72px;display:flex;flex-direction:column;gap:56px}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.brand{font:700 20px 'Space Grotesk','Noto Sans KR',sans-serif;color:var(--accent)}
.langs{display:flex;gap:8px}
.langs button{min-width:44px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--accent);background:transparent;color:var(--accent);font:600 14px 'Inter',sans-serif;cursor:pointer}
.langs button.on{background:var(--accent);color:#fff}
h1,h2,h3{font-family:'Space Grotesk','Noto Sans KR',sans-serif;margin:0}
h1{font-size:48px;line-height:1.1}
h2{font-size:28px}
.kicker{font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#4A5262}
.sub{margin:0;font-size:18px;line-height:1.6;color:#2F3541;max-width:760px}
.sec{display:flex;flex-direction:column;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.card{background:#fff;border:1px solid #DAD8D0;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:#E6ECF6;color:#1B3560}
.tag.st{background:#EFEDE6;color:#3B4150}
.card p{margin:0;font-size:15px;line-height:1.6;color:#2F3541;flex:1 1 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;font-size:15px;text-decoration:none;align-self:flex-start}
.btn:hover{color:#fff;background:#1B3560}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.shots img{width:100%;height:auto;border-radius:14px;border:1px solid #DAD8D0;display:block}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.svc div.i{border-top:2px solid var(--accent);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.svc b{font-size:17px}.svc span{font-size:15px;line-height:1.55;color:#2F3541}
.contact{background:#16181D;color:#F6F5F1;border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:12px}
.contact p{margin:0;font-size:16px;line-height:1.6;color:#D6D8DE}
.contact .l{display:flex;flex-direction:column;gap:6px;font-size:18px;font-weight:600}
.contact a{color:#9DB8E8}
@media(max-width:600px){h1{font-size:34px}}
</style>
</head>

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function render(lang){
  var t = L[lang];
  document.documentElement.lang = lang;
  ['brand','kicker','heroTitle','heroSub','projectsH','shotsH','servicesH','contactH','contactText'].forEach(function(id){
    document.getElementById(id).textContent = t[id];
  });
  document.getElementById('projects').innerHTML = t.pr.map(function(p,i){
    return '<div class="card"><div class="tags"><span class="tag">'+esc(p.platform)+'</span><span class="tag st">'+esc(p.status)+'</span></div>'+
      '<h3 style="font-size:22px;line-height:1.2">'+esc(p.name)+'</h3><p>'+esc(p.desc)+'</p>'+
      '<a class="btn" href="'+urls[i]+'" target="_blank" rel="noopener">'+esc(i===0?t.cta:t.ctaGame)+'</a></div>';
  }).join('');
  document.getElementById('shots').innerHTML = ['list','quests','card','map'].map(function(n){
    var f = n==='map' ? 'ko-map' : lang+'-'+n;
    return '<img src="'+f+'.jpg" alt="Nubi" loading="lazy">';
  }).join('');
  document.getElementById('services').innerHTML = t.sv.map(function(s){
    return '<div class="i"><b>'+esc(s.t)+'</b><span>'+esc(s.x)+'</span></div>';
  }).join('');
  var codes = {ru:'RU', en:'EN', ko:'한국어'};
  document.getElementById('langs').innerHTML = ['ru','en','ko'].map(function(l){
    return '<button class="'+(l===lang?'on':'')+'" data-l="'+l+'">'+codes[l]+'</button>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#langs button'), function(b){
    b.onclick = function(){ render(b.getAttribute('data-l')); };
  });
}
render('en');
